name: Bug report
description: Report something that does not work
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail to reproduce it.

  - type: input
    id: opencode-version
    attributes:
      label: opencode version
      description: Output of `opencode --version`
      placeholder: "1.19.5"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - /files dialog
        - Switch project
        - Copy path
        - New terminal
        - Agent tools (file_tree / file_open / file_search)
        - Installation or config
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open opencode in ...
        2. Run /files
        3. Select ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste any `[tui.plugin]` lines from `~/.local/share/opencode/log/opencode.log`.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config
      description: Redact secrets. Show the relevant `plugin` entries from `opencode.jsonc` and `tui.json`.
      render: jsonc
