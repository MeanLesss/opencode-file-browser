<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" fill="none" role="img" aria-label="Illustration of the opencode-file-browser /files dialog">
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1000" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="win">
      <rect x="12" y="12" width="976" height="576" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1000" height="600" fill="#06080D"/>
  <g filter="url(#shadow)">
    <rect x="12" y="12" width="976" height="576" rx="16" fill="url(#window)" stroke="#30363D"/>
  </g>

  <path d="M12 28C12 19.1634 19.1634 12 28 12H972C980.837 12 988 19.1634 988 28V56H12V28Z" fill="#161B22"/>
  <circle cx="38" cy="34" r="5" fill="#F85149"/>
  <circle cx="56" cy="34" r="5" fill="#D29922"/>
  <circle cx="74" cy="34" r="5" fill="#3FB950"/>
  <text x="500" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8B949E">opencode  ·  /files</text>

  <text x="48" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F0F6FC">Files — D:/Side Work/my-project</text>
  <text x="952" y="106" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">esc</text>

  <rect x="48" y="124" width="904" height="38" rx="8" fill="#0D1117" stroke="#30363D"/>
  <text x="64" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6E7681">Search folders and files</text>
  <rect x="263" y="132" width="2" height="21" fill="#58A6FF"/>

  <text x="64" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#58A6FF">ACTIONS</text>

  <rect x="48" y="204" width="904" height="36" rx="7" fill="#1F6FEB" fill-opacity="0.18" stroke="#58A6FF" stroke-opacity="0.35"/>
  <text x="64" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#58A6FF">›</text>
  <text x="88" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F0F6FC">Switch project to this folder</text>
  <text x="936" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8B949E">D:/Side Work/my-project</text>

  <text x="88" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#C9D1D9">Copy this folder path</text>
  <text x="936" y="266" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">OSC52 + native</text>

  <text x="88" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#C9D1D9">Open in a new terminal</text>
  <text x="936" y="304" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">opencode in this folder</text>

  <text x="64" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#3FB950">NAVIGATE</text>
  <text x="88" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9D1D9">..</text>

  <text x="64" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#D29922">FOLDERS</text>
  <text x="88" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9D1D9">src/</text>

  <text x="64" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#8B949E">FILES</text>
  <text x="88" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9D1D9">src/tui.ts</text>
  <text x="88" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#C9D1D9">package.json</text>

  <g clip-path="url(#win)">
    <rect x="12" y="574" width="976" height="14" fill="#161B22"/>
    <text x="48" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6E7681">↑↓ move  ·  type to search  ·  enter open  ·  esc close</text>
    <text x="952" y="584" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3FB950">● ready</text>
  </g>
</svg>
